# Based on Airbnb's Swift Style Guide, trimmed to what this project needs.
# swift-format handles formatting; SwiftLint is here for the semantic smells it
# cannot see — force unwraps, oversized types, complexity.

included:
  - src
  - tests
excluded:
  - .build
  - src/desktop/ui

disabled_rules:
  # swift-format owns brace placement for multiline conditions, and wraps
  # long closure capture lists onto their own line.
  - opening_brace
  - closure_parameter_position
  # SwiftUI view bodies are legitimately long and deeply nested; the real
  # signal is type size, which is kept below.
  - closure_body_length
  - multiple_closures_with_trailing_closure
  # Generated rc file templates are long string literals by nature.
  - line_length

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

type_body_length:
  warning: 250
  error: 400

file_length:
  warning: 300
  error: 500
  ignore_comment_only_lines: true

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 12
  error: 20

identifier_name:
  min_length: 2
  excluded: [id, up, to, a, b, r, g, x, y]

nesting:
  type_level: 2

custom_rules:
  # A fixed sleep either slows a test down or races the thing it waits for.
  # Await a real signal, or poll through `waitFor` and `waitUntil`, whose
  # files are the only ones excluded here.
  no_fixed_sleep_in_tests:
    name: "No fixed sleep in tests"
    regex: '\b(?:Task\.sleep|u?sleep)\s*\('
    included:
      - '(^|/)tests/'
    excluded:
      - '(^|/)tests/desktop/web/WebTestSupport\+Page\.swift$'
      - '(^|/)tests/desktop/web/WebTestSupport\+Focus\.swift$'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "Await a real signal or use the polling helpers instead of a fixed sleep."
    severity: error
  # Matching processes by name can reach the person's real desktop. Signal a
  # recorded pid instead.
  no_process_name_kill:
    name: "No process kill by name"
    regex: '\b(?:pkill|killall)\b|kill\s+-9\s+\$\(pgrep'
    included:
      - '(^|/)src/'
      - '(^|/)tests/'
    message: "Do not stop or signal processes by name; use a recorded pid."
    severity: error
