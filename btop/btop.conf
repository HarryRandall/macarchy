# Macarchy keeps only deliberate overrides here. btop supplies the rest of its
# defaults, so new upstream options are not frozen by an old generated config.

color_theme = "Default"
theme_background = False
truecolor = True
rounded_corners = True
update_ms = 2000

proc_sorting = "cpu lazy"
proc_mem_bytes = True
proc_gradient = False

check_temp = True
temp_scale = "celsius"
show_cpu_watts = True
show_battery = True
show_battery_watts = True
