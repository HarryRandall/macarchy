name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Needs a runner with the Xcode 27 toolchain (macOS 26 SDK or later).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Lint
        run: ./tools/lint.sh
      - name: Setup integration test
        run: macarchy/tests/integration/setup.sh
