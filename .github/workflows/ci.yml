name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Needs a runner with the Xcode 27 toolchain (macOS 26 SDK or later).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Install SwiftLint
        run: brew install swiftlint
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Interface checks
        working-directory: src/desktop/ui
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm run check
          corepack pnpm run build
      - name: Build
        run: swift build
      - name: Test
        # The web view tests load the interface built above.
        env:
          MACARCHY_REQUIRE_UI_TESTS: "1"
        run: swift test
      - name: Lint
        run: ./tools/lint.sh
      - name: Setup integration test
        run: |
          tests/integration/setup.sh
          tests/integration/plugins.sh
